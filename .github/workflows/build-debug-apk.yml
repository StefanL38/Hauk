name: Build Debug APK (Stefan-Patch gegen Issue #242)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept all SDK licenses (inkl. Preview-Kanal)
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager --licenses --channel=3 || true

      - name: Install required SDK platform and build-tools (Preview-Kanal)
        run: yes | sdkmanager --channel=3 "platforms;android-37.0" "platforms;android-37.1" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hauk-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
